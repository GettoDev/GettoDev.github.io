<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="Neon Directive | GettoDev" data-es="Neon Directive | GettoDev">Neon Directive | GettoDev</title>
    <meta name="description"
        data-en="Play Neon Directive for free! A cyberpunk action game with stunning neon visuals. Fight your way through the digital world!"
        data-es="¡Juega Neon Directive gratis! Un juego de acción cyberpunk con impresionantes visuales neon. ¡Lucha tu camino a través del mundo digital!"
        content="¡Juega Neon Directive gratis! Un juego de acción cyberpunk con impresionantes visuales neon. ¡Lucha tu camino a través del mundo digital!">
    <meta name="keywords"
        data-en="neon directive, cyberpunk game, action game, html5 game"
        data-es="neon directive, juego cyberpunk, juego de acción, juego html5"
        content="neon directive, juego cyberpunk, juego de acción, juego html5">
    <meta name="author" content="GettoDev">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://gettodev.github.io/neondirective.html">

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="assets/ui/favicon.webp">
    <link rel="apple-touch-icon" href="assets/ui/apple-touch-icon.webp">

    <link href="style.css" rel="stylesheet" type="text/css">
    
    <style>
        .game-container {
            width: 1024px;
            height: 768px;
            margin: 0;
            border: 3px solid #00f0ff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
            background: #000;
            box-sizing: border-box;
        }
        
        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        .game-layout {
            display: flex;
            gap: 20px;
            margin: 20px auto;
            max-width: 1300px;
            align-items: flex-start;
        }
        
        .controls-panel {
            width: 250px;
            height: 768px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00f0ff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            display: flex;
            flex-direction: column;
        }
        
        .controls-panel h3 {
            color: #00f0ff;
            margin-bottom: 15px;
            text-align: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .controls-content {
            flex: 1;
            overflow-y: auto;
        }
        
        .control-item {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 240, 255, 0.1);
            border-radius: 5px;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }
        
        .control-key {
            color: #4bff21;
            font-weight: bold;
            display: inline-block;
            margin-right: 10px;
            padding: 2px 8px;
            background: rgba(75, 255, 33, 0.2);
            border-radius: 3px;
            border: 1px solid #4bff21;
        }
        
        .control-desc {
            color: #fff;
            font-size: 14px;
        }
        
        .game-wrapper {
            flex: 1;
        }
        
        .back-button {
            display: inline-block;
            margin: 20px auto;
            padding: 10px 20px;
            background: #00f0ff;
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            background: #4bff21;
            box-shadow: 0 0 20px rgba(75, 255, 33, 0.5);
        }
        
        @media (max-width: 1044px) {
            .game-container {
                width: 100%;
                max-width: 1024px;
                height: auto;
                aspect-ratio: 1024/768;
            }
            
            .game-layout {
                flex-direction: column;
            }
            
            .controls-panel {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header role="banner">
        <img src="assets/banners/getto-banner.webp" alt="GettoDev Banner - Cyberpunk Gaming Studio" loading="lazy">
    </header>

    <nav role="navigation" aria-label="Main navigation">
        <div id="sidebar"></div>
    </nav>

    <div class="divider"></div>

    <main role="main">
        <div class="game-layout">
            <div class="controls-panel">
                <h3 data-en="Game Controls" data-es="Controles del Juego">Game Controls</h3>
                
                <div class="controls-content">
                   
                    <div class="control-item">
                        <span class="control-key">←</span>
                        <span class="control-desc" data-en="Move Left" data-es="Mover Izquierda">Move Left</span>
                    </div>
                    
                    <div class="control-item">
                        <span class="control-key">→</span>
                        <span class="control-desc" data-en="Move Right" data-es="Mover Derecha">Move Right</span>
                    </div>
                    
                    <div class="control-item">
                        <span class="control-key">SPACE</span>
                        <span class="control-desc" data-en="Shoot Ball" data-es="Lanzar Bola">Shoot Ball</span>
                    </div>
                    
                    <div class="control-item">
                        <span class="control-key">ESC</span>
                        <span class="control-desc" data-en="Pause/Menu" data-es="Pausa/Menú">Pause/Menu</span>
                    </div>
                    
                 
                </div>
            </div>
            
            <div class="game-wrapper">
                <div class="game-container">
                    <iframe src="games/neondirective/index.html" class="game-iframe" title="Neon Directive Game"></iframe>
                </div>
                
                <div style="text-align: center;">
                    <a href="index.html" class="back-button" data-en="← Back to Games" data-es="← Volver a Juegos">← Back to Games</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p class="neon-yellow">--Powered by GettoDev since 1998.--</p>
        <div>
            <img src="assets/badges/a18.gif" alt="ghost" />
            <img src="assets/badges/b38.gif" alt="loading" />
            <img src="assets/badges/c6.gif" alt="arkanoid" />
            <img src="assets/badges/c8.gif" alt="retrogamer" />
            <img src="assets/badges/c11.gif" alt="somanyideas" />
            <img src="assets/badges/d11.gif" alt="pcuser" />
            <img src="assets/badges/d33.gif" alt="thecomputer" />
            <img src="assets/badges/d34.gif" alt="system32" />
            <img src="assets/badges/d57.gif" alt="invaders" />
            <img src="assets/badges/d64.gif" alt="retrovideo" />
            <img src="assets/badges/b56.png" alt="oldelectronic" />
            <img src="assets/badges/d17.png" alt="dukenukem" />
            <img src="assets/badges/d56.png" alt="what" />
        </div>
    </footer>

    <!-- Sidebar script loaded from external file -->
    <script type="text/javascript" src="sidebar.js"></script>
    
    <!-- Language switching script -->
    <script type="text/javascript" src="language-switcher.js"></script>

</body>

</html>
