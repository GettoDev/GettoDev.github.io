        data-es="juegos retro, juegos indie, juegos de navegador, juegos html5, gettodev, arcade, retro gaming"

<body>
    <header role="banner">
        <img src="assets/banners/getto-banner.webp" alt="GettoDev Banner - Indie Game Development Studio" loading="lazy">

    <nav role="navigation" aria-label="Main navigation">

            <div class="controls-panel">

                    <!-- Controls are dynamically injected here by js/game-runner.js -->
                </div>
            </div>
            
            <div class="game-wrapper">
                <div class="game-container">
                    <iframe src="" class="game-iframe" id="gameFrame" title="Game"></iframe>
                </div>
                
                <div class="game-controls">
                    <button class="fullscreen-btn" id="fullscreenBtn" data-en="⛶ Fullscreen" data-es="⛶ Pantalla Completa">
                        ⛶ Fullscreen
                    </button>
                    <div style="text-align: center;">
                        <a href="index.html" class="back-button" data-en="← Back to Games" data-es="← Volver a Juegos">← Back to Games</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p class="neon-yellow">--Powered by GettoDev since 1998.--</p>
        <div>
            <img src="assets/badges/a18.gif" alt="ghost" />

            <img src="assets/badges/d57.gif" alt="invaders" />
            <img src="assets/badges/d64.gif" alt="retrovideo" />
            <img src="assets/badges/b56.png" alt="oldelectronic" />
            <img src="assets/badges/d17.png" alt="dukenukem" />
            <img src="assets/badges/d56.png" alt="what" />
        </div>
    </footer>

    <!-- Core Scripts -->
    <script type="text/javascript" src="js/sidebar.js"></script>
    <script type="text/javascript" src="js/language-switcher.js"></script>
    <script type="text/javascript" src="js/fullscreen.js"></script>

    <script type="text/javascript" src="js/game-runner.js"></script>
