<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='' xml:lang=''>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, user-scalable=no' />
	<title>Go Mafalda</title>
	<style type='text/css'>

		body {
			touch-action: none;
			margin: 0;
			border: 0 none;
			padding: 0;
			text-align: center;
			background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
			color: white;
			font-family: 'Arial', sans-serif;
			overflow: hidden;
		}

		#canvas {
			display: block;
			margin: 0;
			color: white;
			width: 100%;
			height: 100%;
		}

		#canvas:focus {
			outline: none;
		}

		.godot {
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			color: #e0e0e0;
			background-color: #3b3943;
			background-image: linear-gradient(to bottom, #403e48, #35333c);
			border: 1px solid #45434e;
			box-shadow: 0 0 1px 1px #2f2d35;
		}

		/* Enhanced Status Display */
		#status {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			visibility: hidden;
			z-index: 1000;
		}

		.loading-container {
			width: 90%;
			max-width: 500px;
			text-align: center;
			padding: 20px;
			margin: 0 auto;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}

		.game-title {
			font-size: 36px;
			font-weight: bold;
			color: white;
			text-shadow: 0 0 20px rgba(0, 150, 255, 0.8);
			margin-bottom: 10px;
			letter-spacing: 2px;
			text-align: center;
		}

		.game-subtitle {
			font-size: 14px;
			color: #00ccff;
			margin-bottom: 30px;
			letter-spacing: 1px;
			text-align: center;
		}

		#status-splash {
			max-width: 300px;
			max-height: 200px;
			margin-bottom: 30px;
			filter: drop-shadow(0 0 15px rgba(0, 150, 255, 0.5));
			animation: pulse 2s infinite alternate;
		}

		@keyframes pulse {
			0% { opacity: 0.8; transform: scale(0.98); }
			100% { opacity: 1; transform: scale(1.02); }
		}

		#status-progress {
			width: 100%;
			max-width: 400px;
			height: 8px;
			background: rgba(0, 0, 0, 0.3);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 4px;
			padding: 2px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
			visibility: visible;
			margin: 20px auto;
			align-self: center;
		}

		#status-progress-inner {
			height: 100%;
			width: 0;
			box-sizing: border-box;
			transition: width 0.3s ease;
			background: linear-gradient(90deg, #0066ff, #00ccff, #0066ff);
			background-size: 200% 100%;
			border-radius: 2px;
			animation: progressShine 2s infinite linear;
		}

		@keyframes progressShine {
			0% { background-position: -200% 0; }
			100% { background-position: 200% 0; }
		}

		.loading-info {
			display: flex;
			justify-content: space-between;
			color: #ddd;
			font-size: 14px;
			margin-top: 10px;
			margin-bottom: 20px;
			width: 100%;
			max-width: 400px;
			align-self: center;
		}

		.loading-text {
			font-weight: bold;
			text-transform: uppercase;
			letter-spacing: 1px;
			font-size: 12px;
			color: #00ccff;
		}

		.percentage {
			font-size: 16px;
			font-weight: bold;
			color: #ffffff;
			text-shadow: 0 0 10px rgba(0, 204, 255, 0.7);
		}

		.loading-tip {
			color: #aaa;
			font-style: italic;
			font-size: 12px;
			margin-top: 15px;
			min-height: 20px;
			text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
		}

		.loading-dots {
			display: inline-block;
			margin-left: 5px;
		}

		.loading-dots::after {
			content: '...';
			animation: dots 1.5s infinite steps(4, end);
		}

		@keyframes dots {
			0%, 20% { content: '.'; }
			40% { content: '..'; }
			60%, 100% { content: '...'; }
		}

		@media only screen and (orientation:portrait) {
			#status-progress {
				width: 80%;
			}
			
			.game-title {
				font-size: 28px;
			}
			
			#status-splash {
				max-width: 200px;
				max-height: 150px;
			}
		}

		#status-indeterminate {
			height: 42px;
			visibility: visible;
			position: relative;
			display: none;
		}

		#status-indeterminate > div {
			width: 4.5px;
			height: 0;
			border-style: solid;
			border-width: 9px 3px 0 3px;
			border-color: #2b2b2b transparent transparent transparent;
			transform-origin: center 21px;
			position: absolute;
		}

		#status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
		#status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
		#status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
		#status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
		#status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
		#status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
		#status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
		#status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }

		#status-notice {
			margin: 0 100px;
			line-height: 1.3;
			visibility: visible;
			padding: 4px 6px;
			visibility: visible;
			background: rgba(91, 57, 67, 0.9);
			border-radius: 0.5rem;
			border: 1px solid #9b3943;
			backdrop-filter: blur(10px);
		}
	</style>
<link id='-gd-engine-icon' rel='icon' type='image/png' href='index.icon.png' />
<link rel='apple-touch-icon' href='index.apple-touch-icon.png'/>
<link rel='manifest' href='index.manifest.json'>

</head>
<body>
	<canvas id='canvas'>
		HTML5 canvas appears to be unsupported in the current browser.<br />
		Please try updating or use a different browser.
	</canvas>
	<div id='status'>
		<div class='loading-container'>
			<div class='game-title'>GO MAFALDA!</div>
			<div class='game-subtitle'>Powered by GettoDev</div>
			
			<img id='status-splash' src='index.png' alt='Loading...' style='display: none;'>
			
			<div id='status-progress' style='display: none;' oncontextmenu='event.preventDefault();'><div id ='status-progress-inner'></div></div>
			
			<div class='loading-info' id='loading-info' style='display: none;'>
				<div class='loading-text'>Loading resources<span class='loading-dots'></span></div>
				<div id='percentage' class='percentage'>0%</div>
			</div>
			
			<div id='loading-tip' class='loading-tip' style='display: none;'>Initializing game engine...</div>
			
			<div id='status-indeterminate' style='display: none;' oncontextmenu='event.preventDefault();'>
				<div></div>
				<div></div>
				<div></div>
				<div></div>
				<div></div>
				<div></div>
				<div></div>
				<div></div>
			</div>
		</div>
		<div id='status-notice' class='godot' style='display: none;'></div>
	</div>

	<script type='text/javascript' src='index.js'></script>
	<script type='text/javascript'>//<![CDATA[

		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8295232,"index.wasm":19796835},"focusCanvas":true,"gdnativeLibs":[],"serviceWorker":"index.service.worker.js"};
		var engine = new Engine(GODOT_CONFIG);

		(function() {
			const INDETERMINATE_STATUS_STEP_MS = 100;
			var statusProgress = document.getElementById('status-progress');
			var statusProgressInner = document.getElementById('status-progress-inner');
			var statusIndeterminate = document.getElementById('status-indeterminate');
			var statusNotice = document.getElementById('status-notice');
			var statusOverlay = document.getElementById('status');
			var percentageElement = document.getElementById('percentage');
			var loadingTipElement = document.getElementById('loading-tip');
			var loadingTextElement = document.querySelector('.loading-text');
			var loadingInfoElement = document.getElementById('loading-info');
			var statusSplash = document.getElementById('status-splash');

			var initializing = true;
			var statusMode = 'hidden';

			// Loading tips
			const loadingTips = [
				"Initializing game engine...",
				"Loading game assets...",
				"Preparing levels...",
				"Compiling shaders...",
				"Loading textures...",
				"Setting up physics...",
				"Initializing audio system...",
				"Optimizing performance...",
				"Almost ready...",
				"Finalizing setup..."
			];

			let currentTipIndex = 0;

			var animationCallbacks = [];
			function animate(time) {
				animationCallbacks.forEach(callback => callback(time));
				requestAnimationFrame(animate);
			}
			requestAnimationFrame(animate);

			function setStatusMode(mode) {
				if (statusMode === mode || !initializing)
					return;
				
				// Hide all loading elements first
				[statusProgress, statusIndeterminate, statusNotice, loadingInfoElement, loadingTipElement, statusSplash].forEach(elem => {
					if (elem) elem.style.display = 'none';
				});
				
				animationCallbacks = animationCallbacks.filter(function(value) {
					return (value != animateStatusIndeterminate);
				});
				
				switch (mode) {
					case 'progress':
						statusOverlay.style.visibility = 'visible';
						if (statusSplash) statusSplash.style.display = 'block';
						statusProgress.style.display = 'block';
						if (loadingInfoElement) loadingInfoElement.style.display = 'flex';
						if (loadingTipElement) loadingTipElement.style.display = 'block';
						break;
					case 'indeterminate':
						statusOverlay.style.visibility = 'visible';
						if (statusSplash) statusSplash.style.display = 'block';
						statusIndeterminate.style.display = 'block';
						if (loadingInfoElement) loadingInfoElement.style.display = 'flex';
						if (loadingTipElement) loadingTipElement.style.display = 'block';
						animationCallbacks.push(animateStatusIndeterminate);
						break;
					case 'notice':
						statusOverlay.style.visibility = 'visible';
						statusNotice.style.display = 'block';
						break;
					case 'hidden':
						// Add fade out animation
						statusOverlay.style.transition = 'opacity 0.5s ease';
						statusOverlay.style.opacity = '0';
						setTimeout(() => {
							statusOverlay.style.visibility = 'hidden';
							initializing = false;
						}, 500);
						return;
					default:
						throw new Error('Invalid status mode');
				}
				statusMode = mode;
			}

			function animateStatusIndeterminate(ms) {
				var i = Math.floor(ms / INDETERMINATE_STATUS_STEP_MS % 8);
				if (statusIndeterminate.children[i].style.borderTopColor == '') {
					Array.prototype.slice.call(statusIndeterminate.children).forEach(child => {
						child.style.borderTopColor = '';
					});
					statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
				}
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				var lines = text.split('\n');
				lines.forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			};

			function displayFailureNotice(err) {
				var msg = err.message || err;
				console.error(msg);
				setStatusNotice(msg);
				setStatusMode('notice');
				initializing = false;
			};

			function updateLoadingTip(percentage) {
				if (!loadingTipElement) return;
				const tipIndex = Math.min(Math.floor(percentage / 10), loadingTips.length - 1);
				if (tipIndex !== currentTipIndex) {
					currentTipIndex = tipIndex;
					loadingTipElement.textContent = loadingTips[tipIndex];
				}
			}

			function updateLoadingText(percentage) {
				if (!loadingTextElement) return;
				if (percentage < 30) {
					loadingTextElement.innerHTML = 'Loading core assets<span class="loading-dots"></span>';
				} else if (percentage < 70) {
					loadingTextElement.innerHTML = 'Loading game content<span class="loading-dots"></span>';
				} else {
					loadingTextElement.innerHTML = 'Finalizing<span class="loading-dots"></span>';
				}
			}

			if (!Engine.isWebGLAvailable()) {
				displayFailureNotice('WebGL not available');
			} else {
				setStatusMode('indeterminate');
				engine.startGame({
					'onProgress': function (current, total) {
						if (total > 0) {
							statusProgressInner.style.width = current/total * 100 + '%';
							setStatusMode('progress');
							
							// Update percentage and tips
							const percentage = Math.round((current / total) * 100);
							if (percentageElement) {
								percentageElement.textContent = percentage + '%';
								// Add glow effect when near completion
								if (percentage > 90) {
									percentageElement.style.textShadow = '0 0 15px rgba(0, 204, 255, 1)';
								}
							}
							
							updateLoadingTip(percentage);
							updateLoadingText(percentage);
							
							if (current === total) {
								// wait for progress bar animation
								setTimeout(() => {
									setStatusMode('indeterminate');
								}, 500);
							}
						} else {
							setStatusMode('indeterminate');
						}
					},
				}).then(() => {
					setStatusMode('hidden');
					initializing = false;
				}, displayFailureNotice);
			}
		})();
	//]]></script>
</body>
</html>
