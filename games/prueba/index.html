<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LittleJS</title>
</head>
<body>
<script src="littlejs.release.js"></script>
<script>
'use strict';

let ballPlayer, ballCPU, hole;
let aimStart = null;
let aiming = false;
let strokesPlayer = 0;
let strokesCPU = 0;
let turn = 0; // 0 = player, 1 = cpu
let cpuThinking = false;
let cpuAiming = false;
let cpuTimer = new Timer();
let cpuAimDir = vec2();
let cpuAimPower = 0;

let playerHitRival = false;
let cpuHitRival = false;
let winner = null;

const levelSize = vec2(20, 12);

const sound_hit   = new Sound([,,200,,.05,.2,1,2,,,300,.05,,,,,.2]);
const sound_win   = new Sound([,0,600,,.2,.4,1,2,,,800,.1,,,,.5]);

class Wall extends EngineObject
{
    constructor(pos, size)
    {
        super(pos, size);
        this.setCollision();
        this.mass = 0;
        this.color = rgb(0,0,0,0);
    }
}

class Ball extends EngineObject
{
    constructor(pos, color, id)
    {
        super(pos, vec2(.6));
        this.setCollision(true, true);
        this.restitution = .9;
        this.friction = .2;
        this.damping = .995;
        this.ballColor = color;
        this.id = id;
        this.scored = false;
    }

    collideWithObject(o)
    {
        // Detect ball vs ball hit
        if (o instanceof Ball && o.id != this.id)
        {
            if (this.id == 0) playerHitRival = true;
            if (this.id == 1) cpuHitRival = true;
        }
        return true;
    }

    update()
    {
        super.update();
        if (this.velocity.length() < .01)
            this.velocity = vec2();
        this.updateHolePhysics();
    }

    updateHolePhysics()
    {
        if (this.scored) return;

        const toHole = hole.pos.subtract(this.pos);
        const dist = toHole.length();
        const holeRadius = .5;

        if (dist < holeRadius && this.velocity.length() < .25)
        {
            if ((this.id == 0 && playerHitRival) ||
                (this.id == 1 && cpuHitRival))
            {
                this.pos = hole.pos.copy();
                this.velocity = vec2();
                this.scored = true;
                winner = this.id;
                sound_win.play(this.pos);
            }
        }
    }

    render()
    {
        drawCircle(this.pos, this.size.x, this.ballColor);
    }
}

function gameInit()
{
    canvasFixedSize = vec2(1280, 720);
    cameraPos = levelSize.scale(.5);
    cameraScale = 64;
    gravity = vec2(0,0);

    new Wall(vec2(-.5, levelSize.y/2), vec2(1, 50));
    new Wall(vec2(levelSize.x+.5, levelSize.y/2), vec2(1, 50));
    new Wall(vec2(levelSize.x/2, -.5), vec2(50, 1));
    new Wall(vec2(levelSize.x/2, levelSize.y+.5), vec2(50, 1));

    ballPlayer = new Ball(vec2(3, levelSize.y/2 + 1), rgb(1,1,1), 0);
    ballCPU    = new Ball(vec2(3, levelSize.y/2 - 1), rgb(0,1,1), 1);

    hole = { pos: vec2(levelSize.x-3, levelSize.y/2) };
}

function allBallsStopped()
{
    return ballPlayer.velocity.length() < .01 && ballCPU.velocity.length() < .01;
}

function gameUpdate()
{
    if (winner !== null)
    {
        if (keyWasPressed('KeyR')) restart();
        return;
    }

    if (!allBallsStopped()) return;

    if (turn == 0)
        updatePlayerTurn();
    else
        updateCPUTurn();
}

function updatePlayerTurn()
{
    if (mouseWasPressed(0))
    {
        aiming = true;
        aimStart = ballPlayer.pos.copy();
    }

    if (aiming && mouseWasReleased(0))
    {
        aiming = false;
        const drag = aimStart.subtract(mousePos);
        const power = clamp(drag.length(), 0, 5);
        if (power > .1)
        {
            ballPlayer.velocity = drag.normalize(power * .2);
            strokesPlayer++;
            sound_hit.play(ballPlayer.pos);
            turn = 1;
        }
    }
}

function updateCPUTurn()
{
    if (!cpuThinking && !cpuAiming)
    {
        cpuThinking = true;
        cpuTimer.set(1);
    }

    if (cpuThinking && cpuTimer.elapsed())
    {
        cpuThinking = false;
        cpuAiming = true;
        cpuTimer.set(.8);

        const target = cpuHitRival ? hole.pos : ballPlayer.pos;
        const toTarget = target.subtract(ballCPU.pos);
        const distance = toTarget.length();

        let idealPower = clamp(distance * .08, .1, .8);

        const angleError = rand(-.2, .2);
        const powerError = rand(-.1, .1);

        cpuAimDir = toTarget.normalize(1).rotate(angleError);
        cpuAimPower = clamp(idealPower + powerError, .1, .8);
    }

    if (cpuAiming && cpuTimer.elapsed())
    {
        cpuAiming = false;
        ballCPU.velocity = cpuAimDir.scale(cpuAimPower * .2);
        strokesCPU++;
        sound_hit.play(ballCPU.pos);
        turn = 0;
    }
}

function gameRender()
{
    drawRect(cameraPos, vec2(100), rgb(.2,.6,.2));
    drawRect(cameraPos, levelSize, rgb(.1,.4,.1));

    drawCircle(hole.pos, 1.2, rgb(.05,.05,.05));
    drawCircle(hole.pos, 1, rgb(0,0,0));

    if (turn == 0 && aiming)
    {
        const drag = aimStart.subtract(mousePos);
        const power = clamp(drag.length(), 0, 5);
        const dir = drag.normalize(1);
        const end = ballPlayer.pos.add(dir.scale(power));
        drawLine(ballPlayer.pos, end, .1, rgb(1,1,0));
    }

    if (turn == 1 && cpuAiming)
    {
        const end = ballCPU.pos.add(cpuAimDir.scale(cpuAimPower * 5));
        drawLine(ballCPU.pos, end, .1, rgb(0,1,1));
    }
}

function gameRenderPost()
{
    drawTextScreen('Jugador: ' + strokesPlayer + '  CPU: ' + strokesCPU,
        vec2(mainCanvasSize.x/2, 40), 40);

    const ruleText = 'Regla: Golpea rival al menos 1 vez antes de anotar';
    drawTextScreen(ruleText, vec2(mainCanvasSize.x/2, 80), 25);

    if (winner !== null)
    {
        const text = winner == 0 ? 'Gana Jugador!' : 'Gana CPU!';
        drawTextScreen(text + ' - R para reiniciar', mainCanvasSize.scale(.5), 50);
    }
}

function restart()
{
    engineObjectsDestroy();
    strokesPlayer = 0;
    strokesCPU = 0;
    playerHitRival = false;
    cpuHitRival = false;
    winner = null;
    turn = 0;
    cpuThinking = false;
    cpuAiming = false;
    gameInit();
}

engineInit(gameInit, gameUpdate, 0, gameRender, gameRenderPost);

</script>
</body>
</html>
