<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="Super Robot X | GettoDev" data-es="Super Robot X | GettoDev">Super Robot X | GettoDev</title>
    <meta name="description"
        data-en="Play Super Robot X for free! A mech action game with epic battles. Control your robot and save the world!"
        data-es="¡Juega Super Robot X gratis! Un juego de acción de mechs con batallas épicas. ¡Controla tu robot y salva el mundo!"
        content="¡Juega Super Robot X gratis! Un juego de acción de mechs con batallas épicas. ¡Controla tu robot y salva el mundo!">
    <meta name="keywords"
        data-en="super robot x, mech game, robot game, action game, html5 game"
        data-es="super robot x, juego de mechs, juego de robots, juego de acción, juego html5"
        content="super robot x, juego de mechs, juego de robots, juego de acción, juego html5">
    <meta name="author" content="GettoDev">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://gettodev.github.io/superrobotx.html">

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="assets/ui/favicon.webp">
    <link rel="apple-touch-icon" href="assets/ui/apple-touch-icon.webp">

    <link href="style.css" rel="stylesheet" type="text/css">
    

</head>

<body>
    <header role="banner">
        <img src="assets/banners/getto-banner.webp" alt="GettoDev Banner - Cyberpunk Gaming Studio" loading="lazy">
    </header>

    <nav role="navigation" aria-label="Main navigation">
        <div id="sidebar"></div>
    </nav>

    <div class="divider"></div>

    <main role="main">
        <div class="game-layout">
            <div class="controls-panel">
                <h3 data-en="Game Controls" data-es="Controles del Juego">Game Controls</h3>
                
                <div class="controls-content">
                                       
                                        
                    <div class="control-item">
                        <span class="control-key">A</span>
                        <span class="control-desc" data-en="Move Left" data-es="Mover Izquierda">Move Left</span>
                    </div>
                    
                    <div class="control-item">
                        <span class="control-key">D</span>
                        <span class="control-desc" data-en="Move Right" data-es="Mover Derecha">Move Right</span>
                    </div>
                     <div class="control-item">
                        <span class="control-key">W</span>
                        <span class="control-desc" data-en="Look Up" data-es="Mirar Arriba">Look Up</span>
                    </div>
                      <div class="control-item">
                        <span class="control-key">S</span>
                        <span class="control-desc" data-en="Look Down" data-es="Mirar Abajo">Look Down</span>
                    </div>
                    
                    <div class="control-item">
                        <span class="control-key">SPACE</span>
                        <span class="control-desc" data-en="Jump" data-es="Saltar">Jump</span>
                    </div>
                    
                    <div class="control-item">
                        <span class="control-key">K</span>
                        <span class="control-desc" data-en="Attack" data-es="Atacar">Attack</span>
                    </div>
                    <div class="control-item">
                        <span class="control-key">L</span>
                        <span class="control-desc" data-en="Dash" data-es="Dash">Dash</span>
                    </div>
                    <div class="control-item">
                        <span class="control-key">I</span>
                        <span class="control-desc" data-en="Prev Character" data-es="Personaje Anter">Prev Character</span>
                    </div>
                     <div class="control-item">
                        <span class="control-key">O</span>
                        <span class="control-desc" data-en="Next Character" data-es="Personaje Sigui">Next Character</span>
                    </div>                   
                    
                </div>
            </div>
            
            <div class="game-wrapper">
                <div class="game-container">
                    <iframe src="games/superrobotx/index.html" class="game-iframe" title="Super Robot X Game" id="gameFrame"></iframe>
                </div>
                
                <div class="game-controls">
                    <button class="fullscreen-btn" id="fullscreenBtn" data-en="⛶ Fullscreen" data-es="⛶ Pantalla Completa">
                        ⛶ Fullscreen
                    </button>
                    <div style="text-align: center;">
                        <a href="index.html" class="back-button" data-en="← Back to Games" data-es="← Volver a Juegos">← Back to Games</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p class="neon-yellow">--Powered by GettoDev since 1998.--</p>
        <div>
            <img src="assets/badges/a18.gif" alt="ghost" />
            <img src="assets/badges/b38.gif" alt="loading" />
            <img src="assets/badges/c6.gif" alt="arkanoid" />
            <img src="assets/badges/c8.gif" alt="retrogamer" />
            <img src="assets/badges/c11.gif" alt="somanyideas" />
            <img src="assets/badges/d11.gif" alt="pcuser" />
            <img src="assets/badges/d33.gif" alt="thecomputer" />
            <img src="assets/badges/d34.gif" alt="system32" />
            <img src="assets/badges/d57.gif" alt="invaders" />
            <img src="assets/badges/d64.gif" alt="retrovideo" />
            <img src="assets/badges/b56.png" alt="oldelectronic" />
            <img src="assets/badges/d17.png" alt="dukenukem" />
            <img src="assets/badges/d56.png" alt="what" />
        </div>
    </footer>

    <!-- Sidebar script loaded from external file -->
    <script type="text/javascript" src="sidebar.js"></script>
    
    <!-- Language switching script -->
    <script type="text/javascript" src="language-switcher.js"></script>
    
    <!-- Fullscreen functionality -->
    <script type="text/javascript" src="fullscreen.js"></script>

</body>

</html>
